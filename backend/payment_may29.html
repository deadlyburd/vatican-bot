<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vatican Museums Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #666;
            font-size: 14px;
        }
        .value {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .total {
            color: #667eea;
            font-size: 24px;
            font-weight: 700;
        }
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 13px;
            color: #856404;
            text-align: center;
        }
        .secure {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
        .secure svg {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏛️ Vatican Museums</h1>
        <p class="subtitle">Secure Payment Gateway</p>
        
        <div class="info">
            <div class="info-row">
                <span class="label">Date</span>
                <span class="value">May 29, 2026</span>
            </div>
            <div class="info-row">
                <span class="label">Time</span>
                <span class="value">17:30 (5:30 PM)</span>
            </div>
            <div class="info-row">
                <span class="label">Visitors</span>
                <span class="value">5 people</span>
            </div>
            <div class="info-row">
                <span class="label">Reference</span>
                <span class="value">2L2NFKEQ000000DXP1</span>
            </div>
            <div class="info-row">
                <span class="label">Total Amount</span>
                <span class="value total">€100.00</span>
            </div>
        </div>
        
        <form id="paymentForm" action="https://tickets.museivaticani.va/epay/process/2L2NFKEQ000000DXP1" method="GET">
            <button type="submit" class="btn">
                💳 Proceed to Payment
            </button>
        </form>
        
        <div class="warning">
            ⚠️ This payment link expires in 10 minutes
        </div>
        
        <div class="secure">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Secure payment via Vatican Museums official gateway
        </div>
    </div>
    
    <script>
        // Auto-submit after 2 seconds
        setTimeout(function() {
            document.getElementById('paymentForm').submit();
        }, 2000);
    </script>
</body>
</html>
